version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: epb_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./src:/app/src
      - ./data:/app/data
      - ./results:/app/results
      - ./models:/app/models
    environment:
      - MODEL_PATH=/app/models/autoencoder_epb_final.h5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epb_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
